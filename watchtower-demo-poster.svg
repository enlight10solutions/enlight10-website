<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Watchtower vulnerability operations demo</title>
  <desc id="desc">A dark product interface showing a vulnerability workflow reaching verified closure.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050d17"/>
      <stop offset=".58" stop-color="#0a1b2c"/>
      <stop offset="1" stop-color="#06101c"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58d6a1" stop-opacity=".16"/>
      <stop offset="1" stop-color="#58d6a1" stop-opacity=".02"/>
    </linearGradient>
    <pattern id="grid" width="52" height="52" patternUnits="userSpaceOnUse">
      <path d="M52 0H0V52" fill="none" stroke="#fff" stroke-opacity=".035"/>
    </pattern>
    <filter id="goldBlur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <circle cx="1210" cy="80" r="210" fill="#f5c84c" opacity=".04"/>
  <path d="M90 170h1420" stroke="#f5c84c" stroke-opacity=".15"/>

  <g transform="translate(90 62)">
    <circle cx="8" cy="8" r="8" fill="#f5c84c"/>
    <circle cx="8" cy="8" r="22" fill="#f5c84c" opacity=".12" filter="url(#goldBlur)"/>
    <text x="33" y="15" fill="#f8fafc" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="5">WATCHTOWER</text>
    <text x="265" y="14" fill="#718196" font-family="Segoe UI,Arial,sans-serif" font-size="12" letter-spacing="3">VULNERABILITY OPERATIONS</text>
  </g>

  <g transform="translate(150 230)">
    <text fill="#f5c84c" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="4">FROM FINDING TO VERIFIED FIX</text>
    <text y="90" fill="#f8fafc" font-family="Georgia,serif" font-size="78" letter-spacing="-3">Close the</text>
    <text y="178" fill="#f5c84c" font-family="Georgia,serif" font-size="82" font-style="italic" letter-spacing="-3">vulnerability loop.</text>
    <text y="240" fill="#a7b2c0" font-family="Segoe UI,Arial,sans-serif" font-size="23">Context. Human-authorized action. Evidence-backed closure.</text>
  </g>

  <g transform="translate(860 255)">
    <rect width="580" height="390" rx="13" fill="#091522" stroke="#f5c84c" stroke-opacity=".25"/>
    <rect width="580" height="52" rx="13" fill="#0d1d2e"/>
    <path d="M0 52h580" stroke="#fff" stroke-opacity=".08"/>
    <circle cx="27" cy="26" r="5" fill="#f5c84c"/>
    <text x="45" y="31" fill="#8494a7" font-family="Segoe UI,Arial,sans-serif" font-size="11" letter-spacing="2">FINDING WT-2841</text>
    <rect x="35" y="85" width="73" height="24" rx="3" fill="#ff6b6b" fill-opacity=".08" stroke="#ff8787" stroke-opacity=".45"/>
    <text x="50" y="101" fill="#ff9393" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="700" letter-spacing="1">CRITICAL</text>
    <text x="35" y="145" fill="#f5f7fa" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="700">Remote code execution</text>
    <text x="35" y="174" fill="#7d8ea2" font-family="Segoe UI,Arial,sans-serif" font-size="12">Production identity service · Internet exposed</text>
    <g transform="translate(42 210)">
      <circle cx="14" cy="14" r="14" fill="#58d6a1" fill-opacity=".08" stroke="#58d6a1"/>
      <text x="9" y="19" fill="#58d6a1" font-family="Arial,sans-serif" font-size="15">✓</text>
      <path d="M28 14h96" stroke="#58d6a1" stroke-opacity=".65"/>
      <circle cx="138" cy="14" r="14" fill="#58d6a1" fill-opacity=".08" stroke="#58d6a1"/>
      <text x="133" y="19" fill="#58d6a1" font-family="Arial,sans-serif" font-size="15">✓</text>
      <path d="M152 14h96" stroke="#58d6a1" stroke-opacity=".65"/>
      <circle cx="262" cy="14" r="14" fill="#58d6a1" fill-opacity=".08" stroke="#58d6a1"/>
      <text x="257" y="19" fill="#58d6a1" font-family="Arial,sans-serif" font-size="15">✓</text>
      <path d="M276 14h96" stroke="#f5c84c" stroke-opacity=".75"/>
      <circle cx="386" cy="14" r="14" fill="#f5c84c" stroke="#f5c84c"/>
      <text x="381" y="19" fill="#07111d" font-family="Arial,sans-serif" font-size="15">✓</text>
      <text x="-8" y="51" fill="#728397" font-family="Segoe UI,Arial,sans-serif" font-size="9">DISCOVERED</text>
      <text x="113" y="51" fill="#728397" font-family="Segoe UI,Arial,sans-serif" font-size="9">PRIORITIZED</text>
      <text x="236" y="51" fill="#728397" font-family="Segoe UI,Arial,sans-serif" font-size="9">REMEDIATED</text>
      <text x="363" y="51" fill="#f5c84c" font-family="Segoe UI,Arial,sans-serif" font-size="9">VERIFIED</text>
    </g>
    <rect x="35" y="295" width="510" height="68" rx="7" fill="url(#glow)" stroke="#58d6a1" stroke-opacity=".33"/>
    <circle cx="73" cy="329" r="20" fill="none" stroke="#58d6a1"/>
    <text x="65" y="337" fill="#58d6a1" font-family="Arial,sans-serif" font-size="22">✓</text>
    <text x="110" y="319" fill="#789087" font-family="Segoe UI,Arial,sans-serif" font-size="8" letter-spacing="2">CLOSURE STATUS</text>
    <text x="110" y="346" fill="#58d6a1" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700">Verified Closed</text>
  </g>

</svg>
